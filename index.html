function unfold(item){if(reduced.matches)return;const {el,img}=item;const backing=img.cloneNode();backing.style.cssText=img.style.cssText;backing.style.position='absolute';backing.style.inset='0';backing.style.transform='scale(.94)';el.prepend(backing);img.style.position='absolute';img.style.inset='0';const bud=img.animate([{transform:'scale(.22,.38)',opacity:1},{transform:'scale(.62,.76)',opacity:1,offset:.55},{transform:'scale(1)',opacity:1}],{duration:1450,fill:'forwards',easing:'cubic-bezier(.22,.6,.3,1)'});item.animations.push(bud);
for(let j=0;j<6;j++){const piece=img.cloneNode();piece.style.position='absolute';piece.style.inset='0';piece.style.transformOrigin='50% 50%';const points=['50% 50%'];for(let k=0;k<=4;k++){const a=(j*60-32+k*16)*Math.PI/180;points.push(`${50+145*Math.cos(a)}% ${50+145*Math.sin(a)}%`)}piece.style.clipPath=`polygon(${points.join(',')})`;el.append(piece);const a=piece.animate([{transform:`scale(.2,.36) rotate(${j%2?10:-10}deg)`,opacity:0},{transform:`scale(.55,.7) rotate(${j%2?4:-4}deg)`,opacity:1,offset:.4},{transform:'scale(1.025,1.015) rotate(0deg)',opacity:1,offset:.88},{transform:'scale(1) rotate(0deg)',opacity:1}],{duration:1150,delay:j*45,fill:'both',easing:'cubic-bezier(.22,.6,.3,1)'});item.animations.push(a);a.onfinish=()=>piece.remove()}}
function garden(){
cancelAnimationFrame(flowFrame);
const w=stage.clientWidth,h=stage.clientHeight,cx=w/2,cy=h/2,spacing=Math.max(48,Math.min(88,Math.min(w,h)*.135)),items=[];
wall=document.createElement('div');wall.className='flower-wall';wall.style.clipPath='none';stage.append(wall);
let bag=[];
function flower(x,y,back,delay){
 if(!bag.length){bag=[1,2,3,4,5,6,7];for(let i=6;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}
 const id=bag.pop(),size=spacing*(back?3.9:3.1+Math.random()*1.1),el=document.createElement('div'),img=new Image();
 el.className='bloom';el.setAttribute('aria-hidden','true');el.style.cssText=`--size:${size}px;left:${cx}px;top:${cy}px;opacity:0;z-index:${back?1:10+Math.floor(delay)}`;
 img.src=`assets/new-flower-${id}.webp`;img.alt='';img.style.filter=`brightness(${back?.82:.94+Math.random()*.06})`;el.append(img);wall.append(el);
 const item={el,img,animations:[],dx:x-cx,dy:y-cy,back,delay,duration:back?2300:1100+Math.random()*1000,rotation:Math.random()*360,turn:(Math.random()-.5)*180,arc:(Math.random()-.5)*spacing*2.3,phase:Math.random()*Math.PI*2,speed:(Math.random()<.5?-1:1)*( .002+Math.random()*.002)};
 items.push(item);live.add(item);
}
// Only individual flowers are emitted. Each birth has its own time and path.
const count=Math.min(230,Math.max(110,Math.ceil(w*h/(spacing*spacing)*1.1))),targets=[];
let emissionTime=0;
for(let i=0;i<count;i++){
 let target=null,best=-1;
 // Random candidates fill the remaining space without a visible grid or rings.
 for(let k=0;k<12;k++){
  const x=-spacing*.45+Math.random()*(w+spacing*.9),y=-spacing*.45+Math.random()*(h+spacing*.9);
  const distance=targets.length?Math.min(...targets.map(p=>(p.x-x)**2+(p.y-y)**2)):1;
  if(distance>best){best=distance;target={x,y}}
 }
 targets.push(target);
 flower(target.x,target.y,false,emissionTime);
 // Keep the first four births at the original pace, then accelerate smoothly.
 const acceleration=Math.min(1,Math.max(0,(i-3)/8));
 if(i>=4)items[items.length-1].duration*=1-.35*acceleration;
 emissionTime+=(70+Math.random()*45)*(1-.68*acceleration);
}
const started=performance.now(),total=emissionTime+2200;
function frame(now){
 if(!active||leaving)return;
 const elapsed=now-started;
 for(const item of items){
  const t=reduced.matches?1:Math.min(1,Math.max(0,(elapsed-item.delay)/item.duration));
  if(t===0){item.el.style.opacity='0';continue}
  const ease=1-Math.pow(1-t,2.7),opening=item.back?ease:Math.min(1,.06+Math.pow(t/.65,1.35)),len=Math.max(1,Math.hypot(item.dx,item.dy)),curve=Math.sin(t*Math.PI)*(1-t),idle=reduced.matches?0:Math.max(0,elapsed-item.delay-item.duration),rest=Math.min(1,idle/1200),sway=Math.sin(idle*.0005+item.phase),arc=item.back?0:item.arc*curve;
  const x=item.dx*ease-item.dy/len*arc+sway*2*rest,y=item.dy*ease+item.dx/len*arc+Math.cos(idle*.0004+item.phase)*2*rest,rotation=item.rotation+item.turn*(1-ease)+idle*item.speed,scale=Math.max(.001,opening)*(1+(item.back?0:.035*Math.sin(t*Math.PI)));
  item.el.style.opacity='1';item.el.style.transform=`translate(calc(-50% + ${x}px),calc(-50% + ${y}px)) rotate(${rotation}deg) scale(${scale})`;
 }
 if(elapsed>=total||reduced.matches)stage.classList.add('finished');
 if(!reduced.matches)flowFrame=requestAnimationFrame(frame);
}
flowFrame=requestAnimationFrame(frame);
}
function start(){if(active)return;active=true;leaving=false;openButton.disabled=true;stage.classList.add('opened');later(garden,reduced.matches?100:850)}
function next(){if(!active||leaving)return;leaving=true;cancelAnimationFrame(flowFrame);stage.classList.add('leaving');for(const item of live){const rect=item.el.getBoundingClientRect(),w=stage.clientWidth,h=stage.clientHeight;const base=getComputedStyle(item.el).transform;item.animations.forEach(a=>a.cancel());const animation=item.el.animate([{transform:base,opacity:1},{transform:`translate(${(Math.random()-.5)*160}px,${h*1.5+Math.random()*h*.4}px) ${base} scale(.4)`,opacity:0}],{duration:reduced.matches?200:1600+Math.random()*700,delay:reduced.matches?0:(h-rect.top)*.35,fill:'forwards',easing:'cubic-bezier(.4,0,.8,.6)'});item.animations=[animation]}later(()=>{wall?.remove();live.clear();stage.classList.remove('finished');stage.classList.add('end');showPhotoHeart()},reduced.matches?250:3200)}
function showPhotoHeart(){PhotoHeart.start(stage,reduced.matches).then(()=>{later(()=>{if(!stage.classList.contains('rose-view'))stage.classList.add('heart-ready')},reduced.matches?50:5600)})}
function showRose(){if(!stage.classList.contains('heart-ready')||stage.classList.contains('rose-view'))return;stage.classList.add('rose-view');PhotoHeart.stop();StarRose.start(stage,reduced.matches);HeartWish.start(stage,reduced.matches)}
document.querySelector('#rose-next').addEventListener('click',showRose);
const eye=document.querySelector('#wish-eye');eye.addEventListener('click',()=>{const hidden=stage.classList.toggle('wish-hidden');eye.setAttribute('aria-pressed',String(hidden));eye.setAttribute('aria-label',hidden?'Hiện lời chúc':'Ẩn lời chúc để ngắm hoa');eye.title=hidden?'Hiện lời chúc':'Ẩn lời chúc'});
document.querySelector('#blank-next').addEventListener('click',()=>{HeartWish.stop();StarRose.stop();stage.classList.remove('rose-view','heart-ready','wish-hidden');stage.classList.add('blank-view')});
openButton.addEventListener('click',start);document.querySelector('#next').addEventListener('click',next);let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(active&&!leaving){for(const item of live){item.animations.forEach(a=>a.cancel());item.el.remove()}live.clear();wall?.remove();garden()}},250)});
</script></body></html>
